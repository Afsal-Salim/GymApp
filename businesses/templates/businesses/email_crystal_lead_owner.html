<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ lead_title }}</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f4f5; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 520px; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07); overflow: hidden;">
          <tr>
            <td style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 28px 32px; text-align: center;">
              <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #ffffff;">GymApp</h1>
              <p style="margin: 10px 0 0; font-size: 14px; color: #94a3b8;">{{ lead_title }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 28px 32px;">
              <p style="margin: 0 0 8px; font-size: 15px; color: #334155;"><strong>{{ business_name }}</strong></p>
              <p style="margin: 0 0 24px; font-size: 13px; color: #64748b;">Slug: <code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">{{ business_slug }}</code></p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse: collapse;">
                {% for label, value in detail_rows %}
                <tr>
                  <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: #64748b; width: 38%; vertical-align: top;">{{ label }}</td>
                  <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 15px; color: #0f172a; vertical-align: top;">{{ value }}</td>
                </tr>
                {% endfor %}
              </table>
              <p style="margin: 24px 0 0; font-size: 12px; color: #94a3b8;">Reply using the contact details above. This message was sent because someone submitted a form on your gym page.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
