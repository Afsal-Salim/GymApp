<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – GymApp</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); max-width: 400px; width: 100%; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; color: #0f172a; }
    .sub { margin: 0 0 24px; color: #64748b; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #334155; }
    input[type=email], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 16px; }
    input:focus { outline: none; border-color: #3b82f6; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: #0f172a; color: #fff; margin-top: 8px; }
    .btn-primary:hover { background: #1e293b; }
    .divider { display: flex; align-items: center; margin: 24px 0; gap: 12px; }
    .divider span { color: #94a3b8; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    #google-btn-container { display: flex; justify-content: center; margin-bottom: 16px; }
    .error { background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; }
    .links a { color: #3b82f6; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Use your email or sign in with Google.</p>
    <div id="login-error" class="error" role="alert"></div>
    <form id="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <div class="divider"><span>or</span></div>
    <div id="google-btn-container"></div>
    <p class="links">
      Don’t have an account? <a href="/signup/">Sign up</a>
    </p>
  </div>
  {% if google_client_id %}
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function() {
      const API_BASE = '/api/auth';
      const GOOGLE_CLIENT_ID = '{{ google_client_id|escapejs }}';

      function showError(msg) {
        var box = document.getElementById('login-error');
        if (box) { box.textContent = msg || ''; box.style.display = msg ? 'block' : 'none'; }
      }

      function onGoogleCredential(credential) {
        showError('');
        fetch(API_BASE + '/google/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: credential })
        })
          .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; }); })
          .then(function(result) {
            if (result.ok) {
              if (result.data.access) localStorage.setItem('access', result.data.access);
              if (result.data.refresh) localStorage.setItem('refresh', result.data.refresh);
              if (result.data.customer) localStorage.setItem('customer', JSON.stringify(result.data.customer));
              window.location.href = '/';
            } else {
              showError(result.data.error || result.data.detail || 'Sign in failed.');
            }
          })
          .catch(function() { showError('Network error. Try again.'); });
      }

      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        showError();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        fetch(API_BASE + '/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        })
          .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
          .then(function(result) {
            if (result.ok) {
              if (result.data.access) localStorage.setItem('access', result.data.access);
              if (result.data.refresh) localStorage.setItem('refresh', result.data.refresh);
              if (result.data.customer) localStorage.setItem('customer', JSON.stringify(result.data.customer));
              window.location.href = '/';
            } else {
              showError(result.data.detail || result.data.error || 'Invalid credentials.');
            }
          })
          .catch(function() { showError('Network error. Try again.'); });
      });

      if (GOOGLE_CLIENT_ID) {
        function initGoogle() {
          if (typeof google === 'undefined' || !google.accounts) return;
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: function(res) { if (res && res.credential) onGoogleCredential(res.credential); }
          });
          google.accounts.id.renderButton(document.getElementById('google-btn-container'), {
            type: 'standard',
            theme: 'outline',
            size: 'large',
            text: 'signin_with',
            width: 320
          });
        }
        if (typeof google !== 'undefined' && google.accounts) initGoogle();
        else window.addEventListener('load', function() { setTimeout(initGoogle, 500); });
      }
    })();
  </script>
  {% else %}
  <p style="text-align:center;color:#64748b;">Google sign-in is not configured (set GOOGLE_OAUTH_CLIENT_ID).</p>
  {% endif %}
</body>
</html>
